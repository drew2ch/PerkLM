system:
    seed: 893
    exp_dir: './experiments'
    epochs: 12
    batch_size: 4
    accum_steps: 32
    n_workers: 4
    patience: 10

optim:
    lr: 0.0001
    wd: 0.01
    min_lr: 0.00001
    warmup: 500
    total_steps: 12625
    
model:
    d_model: 512
    n_heads: 8
    n_layers: 6
    d_ff: 2048
    dropout: 0.1
    maxt: 512
    tokenizer: './tokenizer'
