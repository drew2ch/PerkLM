system:
    seed: 893
    exp_dir: './experiments'
    epochs: 10
    batch_size: 32
    accum_steps: 4
    n_workers: 4
    patience: 10

optim:
    lr: 0.0001
    wd: 0.01
    min_lr: 0.00001
    warmup: 500
    total_steps: 12625
    
model:
    d_model: 256
    n_heads: 4
    n_layers: 4
    d_ff: 1024
    dropout: 0.1
    maxt: 256
    tokenizer: './tokenizer'
